
name: CI
on: [push, pull_request]

jobs:
  linter:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        path: windswept

    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "5.2"

    - uses: leafo/gh-actions-luarocks@v6

    - name: Pull gluacheck
      uses: actions/checkout@v7
      with:
        repository: impulsh/gluacheck
        path: luacheck

    - name: Build gluacheck
      working-directory: luacheck
      run: luarocks make

    - name: Lint
      working-directory: windswept
      run: luacheck .

    # Ratchet: new client->server net.Receive must use ws.action / ws.weapon.NetReceive, or be
    # justified in tools/net-handlers.allowlist. Scans the framework here; the schema/addon are
    # gated by the same script on the local pre-ship run (they have no CI of their own).
    - name: Net-handler guard gate
      working-directory: windswept
      run: bash tools/check-net-handlers.sh

    # Char-creation validators must accept their own defaults even with content-less appearance,
    # or a default/derived value blocks creation -- the reject-vs-clamp class (physBirthDay, skin
    # tone, hair, eye, facial hair). Pure Lua, no GMod needed.
    - name: Char-var validator test
      working-directory: windswept
      run: lua tests/validators_accept_defaults.lua

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow the deploy step to push the built docs to the gh-pages branch

    steps:
      - uses: actions/checkout@v7
        with:
          path: windswept

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.2"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Pull LDoc
        uses: actions/checkout@v7
        with:
          repository: impulsh/LDoc
          path: ldoc

      - name: Build LDoc
        working-directory: ldoc
        run: luarocks make

      - name: Build docs
        working-directory: windswept
        run: ldoc . --fatalwarnings

      - name: Copy assets
        working-directory: windswept
        run: |
          cp -v docs/css/* docs/html
          cp -v docs/js/* docs/html

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'noahsabaj/windswept' && success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: windswept/docs/html
